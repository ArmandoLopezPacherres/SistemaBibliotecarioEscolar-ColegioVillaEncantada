<script>

    function mostrarTabla(seccion, elemento){

        // OCULTAR TODAS
        document.getElementById("tabla-prestamos").style.display = "none";
        document.getElementById("tabla-usuarios").style.display = "none";
        document.getElementById("tabla-morosidad").style.display = "none";
        document.getElementById("tabla-catalogo").style.display = "none";

        // MOSTRAR LA SELECCIONADA
        document.getElementById("tabla-" + seccion).style.display = "block";

        // QUITAR ACTIVO
        let tabs = document.querySelectorAll(".tab");

        tabs.forEach(tab => {
            tab.classList.remove("activo");
        });

        // ACTIVAR TAB
        elemento.classList.add("activo");

    }

</script>
