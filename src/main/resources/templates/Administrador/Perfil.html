<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Ruta Css -->
    <link rel="stylesheet" th:href="@{/Administrador/Perfil.css}">

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div>

            <div class="logo-section">
                <img th:src="@{/img/logo-CVE.png}" alt="logo">
                <h5>Administrador</h5>
            </div>

            <nav class="menu">

                <a th:href="@{/panel-admin}">
                    <i class="bi bi-graph-up"></i>
                    Dashboard
                </a>

                <a th:href="@{/panel-admin/usuarios}">
                    <i class="bi bi-people-fill"></i>
                    Gestión de usuarios
                </a>

                <a th:href="@{/panel-admin/catalogo}">
                    <i class="bi bi-journal"></i>
                    Gestión de catálogo
                </a>

                <a th:href="@{/panel-admin/reportes}">
                    <i class="bi bi-bar-chart-line"></i>
                    Reportes
                </a>

                <a th:href="@{/panel-admin/perfil}" class="activo">
                    <i class="bi bi-person"></i>
                    Perfil
                </a>

            </nav>

        </div>
        <div class="logout">

            <form th:action="@{/logout}" method="post">

                <button type="submit" class="btn btn-outline-light w-100 rounded-pill fw-bold">

                    <i class="bi bi-box-arrow-right"></i>
                    Cerrar Sesión

                </button>

            </form>

        </div>

    </aside>

    </div>

    <main class="contenido">

        <!-- TOP -->
        <div class="top">

            <div>
                <h1>Perfil</h1>
                <p>Visualiza tus datos y modificalos</p>
            </div>

            <div>
                ¡Bienvenido <strong th:text="${usuario.nombre}">Usuario</strong>!
            </div>

        </div>

        <!-- ALERTAS FLASH -->
        <div th:if="${mensajeExito}" class="alert alert-success mt-3 mx-4" role="alert">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${mensajeExito}"></span>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger mt-3 mx-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${mensajeError}"></span>
        </div>


        <div class="perfil-contenedor">

            <!-- FOTO PERFIL -->
            <div class="perfil-superior">

                <!-- FOTO -->
                <div class="foto-perfil">

                    <img src="https://i.pravatar.cc/150?img=32" alt="perfil">

                </div>


                <!-- DATOS -->
                <div class="datos-perfil">
                    <form th:action="@{/panel-admin/perfil/actualizar}" method="post">
                        <input type="hidden" name="id" th:value="${usuario.id}">

                        <!-- NOMBRE -->
                        <div class="campo-perfil">
                            <label>Nombre</label>
                            <input type="text" name="nombre" th:value="${usuario.nombre}" required>
                        </div>

                        <!-- GMAIL / CODIGO -->
                        <div class="campo-perfil">
                            <label>Código o Correo</label>
                            <input type="text" name="codigo" th:value="${usuario.codigo}" required readonly>
                            <small class="text-muted">El código no se puede cambiar</small>
                        </div>

                        <!-- ROL -->
                        <div class="campo-perfil">
                            <label>Rol</label>
                            <input type="text" th:value="${usuario.rol}" readonly>
                        </div>

                        <!-- PASSWORD -->
                        <div class="campo-perfil">
                            <label>Contraseña</label>
                            <div class="input-password">
                                <input type="password" name="password" id="password"
                                    placeholder="Nueva contraseña (opcional)">
                                <i class="bi bi-eye-fill" onclick="mostrarPassword()"></i>
                            </div>
                        </div>

                        <div class="contenedor-boton mt-4">
                            <button type="submit" class="btn-editar">
                                <i class="bi bi-pencil-fill"></i> Actualizar Perfil
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script>

            function mostrarPassword() {

                const input = document.getElementById("password");

                if (input.type === "password") {
                    input.type = "text";
                } else {
                    input.type = "password";
                }

            }

        </script>
