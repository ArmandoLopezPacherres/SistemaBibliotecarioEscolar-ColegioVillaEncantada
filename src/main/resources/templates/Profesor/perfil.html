<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Perfil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet"
        th:href="@{/Profesor/perfil.css}">

</head>

<body>

    <div class="main-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div>

                <!-- LOGO -->
                <div class="logo-section">

                    <img th:src="@{/img/logo-CVE.png}"
                        alt="logo">

                    <h5>Profesor</h5>

                </div>

                <hr>

                <!-- MENU -->
                <ul class="menu">

                    <li>
                        <a th:href="@{/panel-profesor/buscar-libro}">
                            <i class="fa-solid fa-book-open"></i>
                            Buscar libros
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/mi-actividad}">
                            <i class="fa-solid fa-bolt"></i>
                            Mi actividad
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/historial}">
                            <i class="fa-regular fa-clock"></i>
                            Historial
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/notificaciones}">
                            <i class="fa-regular fa-bell"></i>
                            Notificaciones
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/perfil}" class="active">
                            <i class="fa-regular fa-user"></i>
                            Perfil
                        </a>
                    </li>

                </ul>

            </div>

            <div class="logout">
                <form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;"></form>
                <a href="javascript:document.getElementById('logoutForm').submit();">
                    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                </a>
            </div>

        </aside>

        <!-- CONTENT -->
        <main class="content">

            <!-- HEADER -->
            <div class="top-header">

                <div class="title">

                    <h1>Perfil</h1>

                    <p>
                        Visualiza y administra tu información personal
                    </p>

                </div>

                <div class="user">

                    <i class="fa-regular fa-user"></i>

                    ¡Bienvenido
                    <strong th:text="${usuario.nombre}">Usuario</strong>!

                </div>

            </div>

            <!-- PROFILE -->
            <div class="profile-container">

                <div class="profile-card">

                    <!-- LEFT -->
                    <div class="profile-left">

                        <div class="profile-icon">

                            <i class="fa-solid fa-user"></i>

                        </div>

                    </div>

                    <!-- RIGHT -->
                    <div class="profile-right">

                        <div class="profile-grid">

                            <div class="profile-item">
                                <span>Nombre</span>
                                <p th:text="${usuario.nombre}">Juan Pérez</p>
                            </div>

                            <div class="profile-item">
                                <span>Rol</span>
                                <p th:text="${usuario.rol.name()}">Estudiante</p>
                            </div>

                            <div class="profile-item">
                                <span>Código</span>
                                <p th:text="${usuario.codigo}">E432</p>
                            </div>

                        </div>

                        <hr style="border-color: #dce3ea; margin: 30px 0;">

                        <h5 style="color: #072b4a; font-weight: 600; font-size: 16px; margin-bottom: 20px;">Cambiar contraseña</h5>
                        
                        <form id="form-perfil">
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label class="form-label" style="font-size: 13px; font-weight: 600; color: #555;">Contraseña actual</label>
                                    <input type="password" id="input-password-actual" class="form-control" style="border-radius: 8px; font-size: 14px; padding: 10px 14px; border: 1px solid #dce3ea;" placeholder="Requerido" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" style="font-size: 13px; font-weight: 600; color: #555;">Nueva contraseña</label>
                                    <input type="password" id="input-nueva-password" class="form-control" style="border-radius: 8px; font-size: 14px; padding: 10px 14px; border: 1px solid #dce3ea;" placeholder="Opcional">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" style="font-size: 13px; font-weight: 600; color: #555;">Confirmar nueva contraseña</label>
                                    <input type="password" id="input-confirmar-password" class="form-control" style="border-radius: 8px; font-size: 14px; padding: 10px 14px; border: 1px solid #dce3ea;" placeholder="Opcional">
                                </div>
                            </div>

                            <div class="profile-button-container" style="margin-top: 10px; justify-content: flex-end;">
                                <button type="submit" class="btn-edit" style="width: auto; padding: 12px 24px;">
                                    Guardar cambios
                                </button>
                            </div>
                        </form>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('form-perfil').addEventListener('submit', async function(e) {
            e.preventDefault();

            const passwordActual = document.getElementById('input-password-actual').value;
            const nuevaPassword = document.getElementById('input-nueva-password').value;
            const confirmarPassword = document.getElementById('input-confirmar-password').value;

            if (passwordActual || nuevaPassword || confirmarPassword) {
                if (nuevaPassword !== confirmarPassword) {
                    return Swal.fire({
                        icon: 'warning',
                        title: 'Advertencia',
                        text: 'Las nuevas contraseñas no coinciden',
                        confirmButtonColor: '#072b4a'
                    });
                }
                if (!passwordActual) {
                    return Swal.fire({
                        icon: 'warning',
                        title: 'Advertencia',
                        text: 'Debes ingresar tu contraseña actual para confirmar el cambio',
                        confirmButtonColor: '#072b4a'
                    });
                }
            }

            try {
                const res = await fetch('/api/profesor/perfil/actualizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passwordActual, nuevaPassword, confirmarPassword })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Perfil actualizado!',
                        text: 'Tus datos se guardaron correctamente',
                        confirmButtonColor: '#072b4a'
                    }).then(() => {
                        window.location.reload();
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: data.message || 'Hubo un error al guardar los cambios',
                        confirmButtonColor: '#072b4a'
                    });
                }
            } catch (err) {
                console.error("Error al actualizar perfil:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de red',
                    text: 'No se pudo conectar con el servidor',
                    confirmButtonColor: '#072b4a'
                });
            }
        });
    </script>
</body>

</html>
