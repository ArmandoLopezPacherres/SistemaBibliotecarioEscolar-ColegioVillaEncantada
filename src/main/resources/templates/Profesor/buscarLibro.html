<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buscar Libros</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/Profesor/buscarLibro.css}">
    <style>
        /* Evita que los mensajes de validación desplacen el contenido */
        .invalid-feedback {
            font-size: 0.8rem;
            margin-top: 2px;
        }
        .mb-3 {
            position: relative;
        }
    </style>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- CSRF Tokens -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body>

    <div class="main-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div>

                <!-- LOGO -->
                <div class="logo-section">

                    <img th:src="@{/img/logo-CVE.png}" alt="Logo">

                    <h5>Profesor</h5>

                </div>

                <hr>

                <!-- MENU -->
                <ul class="menu">

                    <li>
                        <a th:href="@{/panel-profesor/buscar-libro}" class="active">
                            <i class="fa-solid fa-book-open"></i>
                            Buscar libros
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/mi-actividad}">
                            <i class="fa-solid fa-bolt"></i>
                            Mi actividad
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/historial}">
                            <i class="fa-regular fa-clock"></i>
                            Historial
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/notificaciones}">
                            <i class="fa-regular fa-bell"></i>
                            Notificaciones
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/perfil}">
                            <i class="fa-regular fa-user"></i>
                            Perfil
                        </a>
                    </li>

                </ul>

            </div>

            <div class="logout">
                <form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;"></form>
                <a href="javascript:document.getElementById('logoutForm').submit();">
                    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                </a>
            </div>

        </aside>

        <!-- CONTENIDO -->
        <main class="content">

            <!-- HEADER -->
            <div class="top-header">

                <div class="title">

                    <h1>¡Busca tu libro!</h1>

                    <p>
                        Encuentra el libro de tu preferencia y resérvalos.
                    </p>

                </div>

                <div class="user">

                    <i class="fa-regular fa-user"></i>

                    ¡Bienvenido
                    <strong th:text="${usuario.nombre}">Usuario</strong>!

                </div>

            </div>

            <!-- SEARCH -->
            <div class="search-section">

                <input type="text" id="searchInput" class="search-input"
                    placeholder="Escribe el título del libro, autor o tema">

            </div>

            <!-- RECOMENDACIONES -->
            <div class="recommendation-header">

                <h3>Recomendaciones</h3>

                <select id="categorySelect" class="category-select">

                    <option value="" selected>Todas las categorías</option>

                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}">Categoría
                    </option>

                </select>

            </div>

            <!-- LIBROS + PAGINACIÓN -->
            <div class="books-section-wrapper">

                <div id="booksContainer" class="books-container">
                    <!-- Se llenará dinámicamente vía JavaScript -->
                </div>

                <!-- PAGINACIÓN -->
                <div id="pagination" class="pagination-container" style="display:none;"></div>

            </div>

        </main>

    </div>

    <!-- Script de Funcionalidad -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const categorySelect = document.getElementById('categorySelect');
            const booksContainer = document.getElementById('booksContainer');
            const paginationContainer = document.getElementById('pagination');

            const PAGE_SIZE = 8;
            let todosLosLibros = [];
            let paginaActual = 1;

            // Cargar libros al inicio
            fetchLibros();

            // Eventos: búsqueda al cambiar categoría o escribir (con debounce)
            categorySelect.addEventListener('change', fetchLibros);
            
            let debounceTimer;
            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    fetchLibros();
                }, 400); // 400ms de espera al terminar de escribir
            });

            function fetchLibros() {
                const q = searchInput.value.trim();
                const catId = categorySelect.value;

                let url = '/api/profesor/libros?';
                if (q) url += `q=${encodeURIComponent(q)}&`;
                if (catId) url += `categoriaId=${catId}`;

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        todosLosLibros = data;
                        paginaActual = 1;
                        renderPagina();
                    })
                    .catch(err => console.error("Error obteniendo libros:", err));
            }

            function renderPagina() {
                booksContainer.innerHTML = '';
                paginationContainer.innerHTML = '';

                if (todosLosLibros.length === 0) {
                    booksContainer.innerHTML = '<p class="empty-message"><i class="fas fa-book-open" style="display:block; font-size:32px; margin-bottom:12px; color:#ccc;"></i>No se encontraron libros con esos criterios.</p>';
                    paginationContainer.style.display = 'none';
                    return;
                }

                const totalPaginas = Math.ceil(todosLosLibros.length / PAGE_SIZE);
                const inicio = (paginaActual - 1) * PAGE_SIZE;
                const fin = Math.min(inicio + PAGE_SIZE, todosLosLibros.length);
                const librosPagina = todosLosLibros.slice(inicio, fin);

                librosPagina.forEach(libro => {
                    const imgSrc = libro.isbn
                        ? `https://covers.openlibrary.org/b/isbn/${libro.isbn}-L.jpg`
                        : `https://via.placeholder.com/100x150?text=Sin+Portada`;

                    const authorName = libro.autor ? libro.autor.nombreCompleto : 'Autor desconocido';
                    const categoryName = libro.categoria ? libro.categoria.nombre : 'Sin categoría';
                    const sinStock = libro.stock <= 0;
                    const stockClass = sinStock ? 'sin-stock' : '';
                    const stockText = sinStock ? '0' : libro.stock;

                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.innerHTML = `
                        <div class="book-cover">
                            <img src="${imgSrc}" alt="${libro.titulo}"
                                 onerror="this.parentElement.style.background='#dee2e6'; this.style.display='none';">
                        </div>
                        <div class="book-info">
                            <p class="book-title">${libro.titulo}</p>
                            <p class="book-author">${authorName}</p>
                            <p class="book-category">${categoryName}</p>
                            <p class="book-stock">Disponibles: <span class="${stockClass}">${stockText}</span></p>
                            <button class="btn-book" onclick="solicitarLibro(${libro.id}, '${libro.titulo.replace(/'/g, "\\'")}', '${authorName.replace(/'/g, "\\'")}')"
                                    ${sinStock ? 'disabled' : ''}>
                                ${sinStock ? 'Sin stock' : 'Solicitar'}
                            </button>
                        </div>
                    `;
                    booksContainer.appendChild(card);
                });

                // Barra de paginación estilo imagen
                paginationContainer.style.display = 'flex';
                const mostrando = `Mostrando ${inicio + 1}–${fin} de ${todosLosLibros.length}`;

                paginationContainer.innerHTML = `
                    <span class="pagination-info">${mostrando}</span>
                    <div class="pagination-controls">
                        <button class="pagination-btn" id="btnPrev" ${paginaActual === 1 ? 'disabled' : ''}>
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <span class="pagination-label">Pág. ${paginaActual} / ${totalPaginas}</span>
                        <button class="pagination-btn" id="btnNext" ${paginaActual === totalPaginas ? 'disabled' : ''}>
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                `;

                document.getElementById('btnPrev').addEventListener('click', () => {
                    if (paginaActual > 1) { paginaActual--; renderPagina(); }
                });
                document.getElementById('btnNext').addEventListener('click', () => {
                    if (paginaActual < totalPaginas) { paginaActual++; renderPagina(); }
                });
            }
        });

        function solicitarLibro(libroId, titulo, autor) {
            const hoy = new Date();
            const fechaSolicitud = hoy.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            
            const max = new Date();
            max.setDate(max.getDate() + 7);
            const fechaMaxima = max.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            
            // Formatear maxDate para el input type="date" (YYYY-MM-DD)
            const maxInput = max.toISOString().split('T')[0];
            const minInput = hoy.toISOString().split('T')[0];

            Swal.fire({
                html: `
                    <div style="text-align: left; font-family: 'Segoe UI', sans-serif;">
                        <h3 style="text-align: center; margin: 0 0 25px 0; font-weight: 800; color: #072b4a; letter-spacing: 1px;">SOLICITUD</h3>
                        <form id="formSolicitud" class="needs-validation" novalidate>
                        <input type="hidden" id="modalLibroId" value="${libroId}">
                        
                        <div class="mb-3">
                            <h6 style="color: #0c2947; font-weight: 700; margin-bottom: 4px;">Nombre del libro:</h6>
                            <p style="color: #666; margin-bottom: 0; font-size: 15px;">${titulo}</p>
                        </div>
                        
                        <div class="mb-3">
                            <h6 style="color: #0c2947; font-weight: 700; margin-bottom: 4px;">Autor:</h6>
                            <p style="color: #666; margin-bottom: 0; font-size: 15px;">${autor}</p>
                        </div>
                        
                        <div class="mb-3">
                            <h6 style="color: #0c2947; font-weight: 700; margin-bottom: 4px;">Fecha de solicitud:</h6>
                            <p style="color: #666; margin-bottom: 0; font-size: 15px;">${fechaSolicitud}</p>
                        </div>

                        <div class="mb-3">
                            <h6 style="color: #0c2947; font-weight: 700; margin-bottom: 4px;">Fecha máxima de devolución:</h6>
                            <p style="color: #666; margin-bottom: 0; font-size: 15px;">${fechaMaxima}</p>
                        </div>
                        
                        <div class="mb-4">
                            <h6 style="color: #0c2947; font-weight: 700; margin-bottom: 8px;">Selecciona la fecha de devolución:</h6>
                            <input type="date" class="form-control" id="modalFechaDevolucion" required style="border: 1px solid #ccc; color: #333; padding: 10px; width: 100%; box-sizing: border-box;" min="${minInput}" max="${maxInput}">
                            <div class="invalid-feedback" style="color: red; font-size: 12px; margin-top: 5px;">Por favor, selecciona una fecha de devolución válida.</div>
                        </div>
                        </form>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#072b4a',
                cancelButtonColor: '#e0e5eb',
                confirmButtonText: 'Confirmar solicitud',
                cancelButtonText: '<span style="color: #444; font-weight: 500;">Cancelar</span>',
                customClass: {
                    popup: 'custom-solicitud-modal',
                    confirmButton: 'btn-solicitar-custom',
                    cancelButton: 'btn-cancelar-custom'
                },
                width: '450px',
                preConfirm: () => {
                    const form = document.getElementById('formSolicitud');
                    if (!form.checkValidity()) {
                        form.classList.add('was-validated');
                        return false;
                    }
                    return document.getElementById('modalFechaDevolucion').value;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const fechaDevolucionSeleccionada = result.value;
                    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                    // Aunque por ahora el backend no guarda la fecha de devolución, la enviamos por si acaso
                    fetch(`/api/profesor/reservas/solicitar?libroId=${libroId}&fechaDevolucion=${fechaDevolucionSeleccionada}`, {
                        method: 'POST',
                        headers: {
                            [csrfHeader]: csrfToken
                        }
                    })
                        .then(res => {
                            if (res.ok) {
                                Swal.fire({
                                    title: '¡Solicitado!',
                                    text: 'Tu reserva está pendiente de aprobación.',
                                    icon: 'success',
                                    confirmButtonColor: '#072b4a'
                                });
                                document.getElementById('categorySelect').dispatchEvent(new Event('change'));
                            } else {
                                res.text().then(msg => Swal.fire('Error', msg || 'No se pudo realizar la solicitud.', 'error'));
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            Swal.fire('Error', 'Error de conexión con el servidor.', 'error');
                        });
                }
            });
        }
    </script>
</body>

</html>
