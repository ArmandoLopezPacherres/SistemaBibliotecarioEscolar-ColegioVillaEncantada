<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/Profesor/historial.css}">

</head>

<body>

    <div class="main-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div>

                <!-- LOGO -->
                <div class="logo-section">

                    <img th:src="@{/img/logo-CVE.png}" alt="logo">

                    <h5>Profesor</h5>

                </div>

                <hr>

                <!-- MENU -->
                <ul class="menu">

                    <li>
                        <a th:href="@{/panel-profesor/buscar-libro}">
                            <i class="fa-solid fa-book-open"></i>
                            Buscar libros
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/mi-actividad}">
                            <i class="fa-solid fa-bolt"></i>
                            Mi actividad
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/historial}" class="active">
                            <i class="fa-regular fa-clock"></i>
                            Historial
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/notificaciones}">
                            <i class="fa-regular fa-bell"></i>
                            Notificaciones
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/panel-profesor/perfil}">
                            <i class="fa-regular fa-user"></i>
                            Perfil
                        </a>
                    </li>

                </ul>

            </div>

            <!-- LOGOUT -->
            <div class="logout">
                <form th:action="@{/logout}" method="post" id="logoutForm" style="display: none;"></form>
                <a href="javascript:document.getElementById('logoutForm').submit();">
                    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                </a>
            </div>

        </aside>

        <!-- CONTENT -->
        <main class="content">

            <!-- HEADER -->
            <div class="top-header">

                <div class="title">

                    <h1>Historial</h1>

                    <p>
                        Puedes visualizar los libros que ya leíste y devolviste
                    </p>

                </div>

                <div class="user">

                    <i class="fa-regular fa-user"></i>

                    ¡Bienvenido
                    <strong th:text="${usuario.nombre}">Usuario</strong>!

                </div>

            </div>

            <!-- SECTION -->
            <div class="section">

                <div class="section-header">

                    <h3>Devoluciones</h3>

                    <div class="filters">

                        <select class="filter-select" id="filtro-orden" onchange="aplicarFiltros()">
                            <option value="devolucion-desc">Fecha Devolución (Más recientes)</option>
                            <option value="devolucion-asc">Fecha Devolución (Más antiguos)</option>
                            <option value="entrega-desc">Fecha Entrega (Más recientes)</option>
                            <option value="entrega-asc">Fecha Entrega (Más antiguos)</option>
                        </select>

                    </div>

                </div>

                <!-- TABLE -->
                <div class="table-container">

                    <table class="table custom-table align-middle">

                        <thead>

                            <tr>

                                <th>Título del Libro</th>
                                <th>Categoría</th>
                                <th>Fecha Entrega</th>
                                <th>Fecha Devolución</th>

                            </tr>

                        </thead>

                        <tbody id="tbody-historial">
                            <!-- JS inyectará los datos aquí -->
                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- Script Principal -->
    <script>
        let allHistorial = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchHistorial();
        });

        function fetchHistorial() {
            fetch('/api/profesor/historial/prestamos')
                .then(res => res.json())
                .then(data => {
                    allHistorial = data;
                    aplicarFiltros();
                })
                .catch(err => console.error("Error cargando historial", err));
        }

        function formatDate(isoString) {
            if (!isoString) return '-';
            const [year, month, day] = isoString.split('-');
            return `${day}-${month}-${year.substring(2)}`;
        }

        function aplicarFiltros() {
            const orden = document.getElementById('filtro-orden').value;
            let filtrados = [...allHistorial];
            
            filtrados.sort((a, b) => {
                const fDevA = new Date(a.fechaDevolucionReal || a.fechaDevolucionEsperada);
                const fDevB = new Date(b.fechaDevolucionReal || b.fechaDevolucionEsperada);
                const fEntA = new Date(a.fechaPrestamo);
                const fEntB = new Date(b.fechaPrestamo);

                switch(orden) {
                    case 'devolucion-desc': return fDevB - fDevA;
                    case 'devolucion-asc': return fDevA - fDevB;
                    case 'entrega-desc': return fEntB - fEntA;
                    case 'entrega-asc': return fEntA - fEntB;
                    default: return fDevB - fDevA;
                }
            });
            
            renderHistorial(filtrados);
        }

        function renderHistorial(historial) {
            const tbody = document.getElementById('tbody-historial');
            tbody.innerHTML = '';

            if (historial.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Aún no tienes libros en tu historial.</td></tr>';
                return;
            }

            historial.forEach(p => {
                const tr = document.createElement('tr');
                // Utilizamos fechaDevolucionReal si existe, sino fechaDevolucionEsperada
                const fechaDev = p.fechaDevolucionReal ? p.fechaDevolucionReal : p.fechaDevolucionEsperada;
                
                tr.innerHTML = `
                    <td>
                        <strong>Libro:</strong>
                        ${p.libro.titulo}
                    </td>
                    <td>
                        <strong>Categoría:</strong>
                        ${p.libro.categoria ? p.libro.categoria.nombre : 'General'}
                    </td>
                    <td>
                        <strong>Fecha:</strong>
                        ${formatDate(p.fechaPrestamo)}
                    </td>
                    <td>
                        <strong>Fecha:</strong>
                        ${formatDate(fechaDev)}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>

</html>
